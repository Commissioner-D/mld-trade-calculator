name: Update Dynasty Values

on:
  schedule:
    # Jeden Mittwoch 09:00 UTC (nach Montag/Dienstag Verletzungsnews, vor den
    # meisten Waiver-Runs). Waehrend der Offseason laeuft's einfach mit den
    # gleichen (dann selteneren) Aenderungen mit -- kostet nichts extra.
    - cron: "0 9 * * 3"
  workflow_dispatch: {}   # manueller "Run workflow"-Button in GitHub

permissions:
  contents: write   # noetig, damit der Bot die aktualisierten Dateien committen darf

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install pandas numpy scipy

      - name: nflverse-Rohdaten laden
        run: python engine/fetch_data.py

      - name: FantasyPros-Offense-Projektionen laden (falls Secret gesetzt ist)
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python engine/fetch_projections.py 2026
        continue-on-error: true   # fehlender/ungueltiger Key soll den Rebuild nicht blockieren
                                  # (das Skript selbst wirft dann eine klare Fehlermeldung im Log)

      - name: Fleaflicker-Spielerpositionen laden
        run: python engine/fetch_fleaflicker_players.py
        continue-on-error: true   # optionale Verfeinerung, kein Blocker fuer den Rest der Pipeline

      - name: Fleaflicker-Rosterdaten laden (fuer echte Rostertiefe)
        run: python engine/fetch_fleaflicker_rosters.py
        continue-on-error: true   # noch experimentell (Schema unbekannt bis zum ersten echten Response)

      - name: Value-Tabelle neu berechnen
        run: python engine/build_value_table.py

      - name: Calculator-Daten neu bauen
        run: python engine/build_calculator_data.py

      - name: Aenderungen committen (nur falls sich was geaendert hat)
        run: |
          git config user.name "dynasty-values-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/ data/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatischer Werte-Rebuild ($(date -u +%Y-%m-%d))"
            # Falls zwischenzeitlich woanders gepusht wurde (z.B. direkter API-Push):
            # rebase + bis zu 3 Versuche, statt einfach zu scheitern.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push fehlgeschlagen (Versuch $i/3), versuche erneut nach Rebase ..."
              sleep 5
            done
          else
            echo "Keine Aenderungen -- nichts zu committen."
          fi
