<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLD-Rechner</title>
<meta name="description" content="Dynasty-Trade-Rechner der Major League Dynasty">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23a8842c'/%3E%3Cpath d='M9 12h13m0 0-3.5-3.5M22 12l-3.5 3.5M23 20H10m0 0 3.5-3.5M10 20l3.5 3.5' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f7f7f7; --line: #dddddd;
  --text: #333333; --muted: #777777; --accent: #337ab7; --accent-ink: #ffffff;
  --a: #337ab7; --b: #8e55c4; --fair: #999999; --ok: #3c763d; --warn: #8a6d3b; --bad: #a94442;
  --radius: 3px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #22252a; --surface: #2e3238; --surface-2: #383d44; --line: #40454d;
    --text: #e3e5e8; --muted: #8f959d; --accent: #f7930a; --accent-ink: #1b1b1b;
    --a: #5ca3e6; --b: #b48ae0; --fair: #8f959d; --ok: #4caf50; --warn: #f0a33a; --bad: #e5534b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #22252a; --surface: #2e3238; --surface-2: #383d44; --line: #40454d;
  --text: #e3e5e8; --muted: #8f959d; --accent: #f7930a; --accent-ink: #1b1b1b;
  --a: #5ca3e6; --b: #b48ae0; --fair: #8f959d; --ok: #4caf50; --warn: #f0a33a; --bad: #e5534b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }

/* Kopf im Fleaflicker-Stil (wie MLD-Copilot) */
header.top { position: sticky; top: 0; z-index: 10; background: linear-gradient(#90959c, #6d7279); border-top: 3px solid #f7930a; border-bottom: 1px solid #4b4f55; }
.top-inner { max-width: 820px; margin: 0 auto; padding: 8px 16px 4px; display: flex; align-items: center; gap: 12px; }
.brand { font-weight: 800; letter-spacing: .02em; font-size: 18px; margin-right: auto; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.brand .dot { width: 10px; height: 10px; border-radius: 2px; background: #f7930a; }
.brand small { font-weight: 500; color: #e6e8eb; font-size: 12px; }
@media (max-width: 480px) { .brand small { display: none; } }
.toggles { display: flex; gap: 6px; align-items: center; }
.icon-btn { border: 1px solid #c9ccd0; background: #fff; color: #333; border-radius: 3px; height: 32px; min-width: 34px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn .caret { font-size: 10px; }
.flag { width: 22px; height: 15px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.15); display: block; }

nav.tabs { max-width: 820px; margin: 0 auto; padding: 0 16px; display: flex; gap: 0; }
nav.tabs a { color: #eef0f2; font-weight: 500; font-size: 15px; padding: 11px 16px; text-decoration: none; text-shadow: 0 1px 0 rgba(0,0,0,.2); }
nav.tabs a:hover { background: rgba(0,0,0,.08); }
nav.tabs a.active { color: #fff; background: rgba(0,0,0,.2); }

main { max-width: 820px; margin: 0 auto; padding: 16px 16px 64px; }
.notice { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px; color: var(--muted); }
.notice.err { color: var(--bad); border-color: var(--bad); }
.meta { color: var(--muted); font-size: 13px; }

/* Einstellungs-Menue */
.settings { position: relative; }
.settings .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 210px; padding: 4px 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.settings .menu[hidden] { display: none; }
.settings .menu-h { padding: 8px 12px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.settings .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 12px 7px 30px; border: 0; background: none;
  text-align: left; color: var(--text); position: relative; font-size: 14px; }
.settings .menu button:hover { background: var(--surface-2); }
.settings .menu button[aria-checked="true"]::before { content: "✓"; position: absolute; left: 12px; color: var(--accent); font-weight: 700; }

/* Karten */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
.card-head { background: var(--surface-2); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.card-head h3 { margin: 0; font-size: 15px; }
.card-body { padding: 14px 16px; }

/* Wertvergleich */
.verdict-val { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.verdict-val b { font-size: 24px; font-variant-numeric: tabular-nums; }
.verdict-val.A b { color: var(--a); } .verdict-val.B b { color: var(--b); }
.track { position: relative; height: 12px; margin: 14px 0 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.track .tick { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: var(--muted); z-index: 1; opacity: .7; }
.track .fill { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; background: var(--fair); transition: left .3s ease, width .3s ease, background-color .3s ease; }
.track-labels { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
.track-labels .la { color: var(--a); } .track-labels .lb { color: var(--b); }
@media (prefers-reduced-motion: reduce) { .track .fill { transition: none; } }

/* Seiten */
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
@media (max-width: 600px) { .sides { grid-template-columns: 1fr; } }
.side { border-radius: 3px; padding: 10px 12px 12px; background: var(--surface-2); border-top: 3px solid var(--a); min-width: 0; }
.side.b { border-top-color: var(--b); }
.side-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.side h4 { margin: 0; font-size: 14px; }
.side.a h4 { color: var(--a); } .side.b h4 { color: var(--b); }
.side .count { font-size: 12px; color: var(--muted); }

.search { width: 100%; border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; background: var(--surface); color: var(--text); font: inherit; }
.search::placeholder { color: var(--muted); }
.search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 264px; overflow-y: auto; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); }
.results:empty { display: none; }
.res { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.res:last-child { border-bottom: 0; }
.res:hover, .res.hl { background: var(--surface-2); }
.res.off { cursor: not-allowed; opacity: .65; }
.res.off:hover { background: none; }
.res-empty { padding: 9px 10px; color: var(--muted); font-size: 13px; cursor: default; display: block; }

.assets { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; min-height: 44px; }
.asset { display: grid; grid-template-columns: 1fr auto 24px; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 7px 8px 7px 10px; }
.a-main, .res > div:first-child { min-width: 0; }
.a-name { font-weight: 600; overflow-wrap: anywhere; }
.a-name .pos { font-size: 11px; font-weight: 700; color: var(--muted); margin-left: 4px; }
.a-info { font-size: 12px; color: var(--muted); line-height: 1.35; }
.a-val { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.a-val.neg { color: var(--bad); }
.a-val.na { color: var(--bad); }
.x { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 4px; border-radius: 3px; }
.x:hover { color: var(--bad); background: var(--surface-2); }
.tag { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 0 6px; margin-left: 4px; border-radius: 2px; line-height: 16px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.tag.warn { color: var(--warn); }
.empty-side { color: var(--muted); font-size: 13px; padding: 10px 2px; }

.total { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; align-items: baseline; }
.total .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.total .num { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.side.a .total .num { color: var(--a); } .side.b .total .num { color: var(--b); }
.adj { min-height: 16px; margin-top: 2px; text-align: right; font-size: 12px; color: var(--bad); }
.srcline { margin-top: 18px; font-size: 12px; color: var(--muted); }

/* Trade-Finder */
.f-controls { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px 12px; align-items: end; }
@media (max-width: 600px) { .f-controls { grid-template-columns: 1fr; } }
.f-controls label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
.f-controls select { width: 100%; border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; background: var(--surface); color: var(--text); font: inherit; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.f-row2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.f-sum { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.f-sec { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.f-sec .n { font-weight: 700; color: var(--text); }
.ft { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; margin-bottom: 6px; }
.ft > summary { list-style: none; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; cursor: pointer; }
.ft > summary::-webkit-details-marker { display: none; }
.ft[open] > summary { border-bottom: 1px solid var(--line); background: var(--surface-2); }
.ft-team { font-weight: 600; overflow-wrap: anywhere; }
.ft-rec { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
.ft-side { text-align: right; white-space: nowrap; }
.ft-gain { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13px; margin-top: 2px; }
.ft-gain.pos { color: var(--ok); } .ft-gain.neg { color: var(--muted); }
.role { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 2px; line-height: 17px; border: 1px solid currentColor; }
.role.best { color: var(--ok); } .role.start { color: var(--accent); } .role.bench1 { color: var(--warn); } .role.depth { color: var(--muted); }
.tag.cuff { color: var(--b); border-color: var(--b); }
.depth { list-style: none; margin: 0; padding: 6px 10px 8px; font-size: 13px; }
.depth li { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; padding: 3px 0; align-items: baseline; }
.depth li .rk { color: var(--muted); font-variant-numeric: tabular-nums; }
.depth li .v { font-variant-numeric: tabular-nums; color: var(--muted); }
.depth li.st .nm { font-weight: 600; }
.depth li.me { background: var(--surface-2); outline: 1px solid var(--accent); border-radius: 2px; }
.depth li.me .nm { color: var(--accent); font-weight: 700; }
.depth li.out { opacity: .55; }
.f-more > summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 6px 0; }

/* Info */
.card.info h2 { margin: 0 0 12px; font-size: 20px; } .card.info h3 { margin: 22px 0 6px; font-size: 16px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.card.info li { margin: 5px 0; } .card.info ol, .card.info ul { padding-left: 22px; }
.card.info p { margin: 6px 0; }
.formula { font-family: ui-monospace, monospace; background: var(--surface-2); padding: 8px 10px; border-radius: 3px; overflow-x: auto; }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/calc"><span class="dot"></span>MLD-Rechner <small>Major League Dynasty</small></a>
    <div class="toggles" id="toggles"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>

<script>
// ---------- Speicher / Einstellungen (gleiche Schluessel wie der MLD-Copilot -> gleiche Origin, Einstellungen gelten fuer beide) ----------
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

const STR = {
  de: {
    calc: "Rechner", info: "Info", team_a: "Team A", team_b: "Team B",
    compare: "Wertvergleich", both_empty: "Beide Seiten leer", even: "Ausgeglichen",
    edge: side => `Vorteil ${side}`, gets_more: side => `${side} bekommt mehr Wert`,
    search_ph: side => `Spieler oder Pick für ${side} suchen …`, loading: "Daten werden geladen …",
    no_match: "Keine Treffer.", empty_side: "Noch nichts hinzugefügt – oben suchen und einen Treffer anklicken.",
    total: "Gesamtwert", remove: "Entfernen",
    assets: n => `${n} ${n === 1 ? "Position" : "Positionen"}`,
    roster_adj: (adj, net) => `Rosterplatz-Abzug ${adj} (netto +${net} Spieler)`,
    taxi: "Taxi-fähig", from_rank: "aus Dynasty-Rang", past: "Vergangenheitswert", no_data: "ohne Daten", na: "NA",
    rookie_pick: "Rookie-Pick", yrs: n => `${n} J.`,
    load_err: m => `Daten konnten nicht geladen werden (${m}). Läuft die Seite über http(s) und nicht als lokale Datei?`,
    sources: "Projektionen und Dynasty-Rankings: FantasyPros · Rosterdaten und Positionen: Fleaflicker · Alter, Draft, Statistiken: nflverse",
    theme: "Darstellung", lang: "Sprache", settings: "Einstellungen",
    th_system: "Wie Gerät", th_light: "Hell", th_dark: "Dunkel",
    finder: "Trade-Finder", f_team: "Team", f_player: "Spieler", f_pick: "Spieler wählen …",
    m_now: "Jetzt (Pkt/Spiel)", m_dyn: "Dynasty-Wert", f_stand: d => `Kader-Stand: ${d} UTC`,
    f_err: m => `Ligadaten konnten nicht geladen werden (${m}).`,
    f_intro: "Spieler wählen: Der Finder setzt ihn in jeden anderen Kader ein, stellt die beste Aufstellung auf und zeigt, welche Rolle er dort hätte.",
    sec_start: "Würde starten", sec_bench1: "Erster Ersatz", sec_cuff: "Handcuff-Interesse", sec_depth: "Nur Kadertiefe",
    r_best: "Bester Spieler", r_start: "Starter", r_flex: "Starter (Flex)", r_bench1: "1. Ersatz", r_depth: "Tiefe",
    replaces: (n, v) => `verdrängt ${n} (${v})`, fills: "füllt einen leeren Slot",
    behind: (list) => `hinter ${list}`, gap: v => `fehlen ${v}`,
    per_week: "Pkt/Woche", val_unit: "Wert",
    cuff: n => `Backup von ${n}`, cuff_own: n => `sichert deinen ${n} ab`,
    here: "bei dir", depth_lbl: (l, tm) => `Depth Chart ${tm}: ${l}`,
    no_metric: "Kein Wert in diesem Maßstab – Rolle nicht sinnvoll bestimmbar.",
    no_pts: "keine Punkte", ir: "IR", taxi_s: "Taxi", none_here: "Keine Teams in dieser Gruppe.",
    cont_only: "Nur Contender", cont_hint: w => `Playoff-Platz (Top 7) oder höchstens 1 Sieg dahinter (ab ${w} Siegen)`,
    cont_hidden: n => `${n} Teams ausgeblendet (keine Contender)`,
  },
  en: {
    calc: "Calculator", info: "Info", team_a: "Team A", team_b: "Team B",
    compare: "Value comparison", both_empty: "Both sides empty", even: "Even",
    edge: side => `Edge for ${side}`, gets_more: side => `${side} gets more value`,
    search_ph: side => `Search player or pick for ${side} …`, loading: "Loading data …",
    no_match: "No matches.", empty_side: "Nothing added yet – search above and click a result.",
    total: "Total value", remove: "Remove",
    assets: n => `${n} asset${n === 1 ? "" : "s"}`,
    roster_adj: (adj, net) => `Roster spot adj. ${adj} (net +${net} players)`,
    taxi: "taxi-eligible", from_rank: "from dynasty rank", past: "past production", no_data: "no data", na: "NA",
    rookie_pick: "Rookie pick", yrs: n => `${n} yrs`,
    load_err: m => `Could not load data (${m}). Is the page running over http(s), not opened as a local file?`,
    sources: "Projections and dynasty rankings: FantasyPros · Rosters and positions: Fleaflicker · Age, draft, stats: nflverse",
    theme: "Appearance", lang: "Language", settings: "Settings",
    th_system: "Match device", th_light: "Light", th_dark: "Dark",
    finder: "Trade Finder", f_team: "Team", f_player: "Player", f_pick: "Pick a player …",
    m_now: "Now (pts/game)", m_dyn: "Dynasty value", f_stand: d => `Rosters as of ${d} UTC`,
    f_err: m => `Could not load league data (${m}).`,
    f_intro: "Pick a player: the finder drops him into every other roster, sets the best lineup and shows what role he would have there.",
    sec_start: "Would start", sec_bench1: "First backup", sec_cuff: "Handcuff interest", sec_depth: "Depth only",
    r_best: "Best player", r_start: "Starter", r_flex: "Starter (flex)", r_bench1: "1st backup", r_depth: "Depth",
    replaces: (n, v) => `replaces ${n} (${v})`, fills: "fills an empty slot",
    behind: (list) => `behind ${list}`, gap: v => `${v} short`,
    per_week: "pts/week", val_unit: "value",
    cuff: n => `backs up ${n}`, cuff_own: n => `backs up your ${n}`,
    here: "on your team", depth_lbl: (l, tm) => `${tm} depth chart: ${l}`,
    no_metric: "No value on this scale – role can't be determined meaningfully.",
    no_pts: "no points", ir: "IR", taxi_s: "Taxi", none_here: "No teams in this group.",
    cont_only: "Contenders only", cont_hint: w => `Playoff spot (top 7) or at most 1 win behind (${w}+ wins)`,
    cont_hidden: n => `${n} teams hidden (not contenders)`,
  },
};
let LANG = store.get("mldc_lang") || ((navigator.language || "").toLowerCase().startsWith("de") ? "de" : "en");
const t = (k, ...a) => { const v = STR[LANG][k]; return typeof v === "function" ? v(...a) : v ?? k; };

function applyTheme() {
  const th = store.get("mldc_theme");
  if (th) document.documentElement.setAttribute("data-theme", th);
  else document.documentElement.removeAttribute("data-theme");
}
applyTheme();
document.documentElement.lang = LANG;

const ICON_GEAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>';
const FLAG_AT = '<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" fill="#c8102e"/><rect y="6.67" width="30" height="6.67" fill="#fff"/></svg>';
const FLAG_US = '<svg class="flag" viewBox="0 0 38 20"><rect width="38" height="20" fill="#fff"/>' +
  [0, 2, 4, 6, 8, 10, 12].map(i => `<rect y="${i * 20 / 13}" width="38" height="${20 / 13}" fill="#b22234"/>`).join("") +
  '<rect width="15.2" height="10.77" fill="#3c3b6e"/>' +
  [[2, 2], [6, 2], [10, 2], [4, 5.4], [8, 5.4], [12, 5.4], [2, 8.8], [6, 8.8], [10, 8.8]].map(([x, y]) => `<circle cx="${x + 1}" cy="${y}" r=".8" fill="#fff"/>`).join("") + "</svg>";

function renderToggles(el, onChange) {
  const th = store.get("mldc_theme") || "system";
  const opt = (group, val, label, icon = "") =>
    `<button role="menuitemradio" aria-checked="${group === "theme" ? th === val : LANG === val}" data-${group}="${val}">${icon}<span>${label}</span></button>`;
  el.innerHTML = `<div class="settings">
    <button class="icon-btn gear" aria-haspopup="true" aria-expanded="false" title="${t("settings")}" aria-label="${t("settings")}">${ICON_GEAR}<span class="caret">▾</span></button>
    <div class="menu" role="menu" hidden>
      <div class="menu-h">${t("theme")}</div>
      ${opt("theme", "system", t("th_system"))}${opt("theme", "light", t("th_light"))}${opt("theme", "dark", t("th_dark"))}
      <div class="menu-h">${t("lang")}</div>
      ${opt("lang", "de", "Deutsch", FLAG_AT)}${opt("lang", "en", "English", FLAG_US)}
    </div></div>`;
  const btn = el.querySelector(".gear"), menu = el.querySelector(".menu");
  btn.onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; btn.setAttribute("aria-expanded", String(!menu.hidden)); };
  if (!window.__mldMenu) {
    window.__mldMenu = true;
    const closeAll = () => document.querySelectorAll(".settings .menu").forEach(m => { m.hidden = true; });
    document.addEventListener("click", e => { if (!e.target.closest(".settings")) closeAll(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeAll(); });
  }
  menu.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.theme) { store.set("mldc_theme", b.dataset.theme === "system" ? null : b.dataset.theme); applyTheme(); }
    if (b.dataset.lang) { LANG = b.dataset.lang; store.set("mldc_lang", LANG); document.documentElement.lang = LANG; onChange && onChange(); }
    renderToggles(el, onChange);
  };
}

// ---------- Helfer ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const loc = () => (LANG === "de" ? "de-AT" : "en-US");
const num = (v, d = 2) => Math.abs(v).toLocaleString(loc(), { minimumFractionDigits: d, maximumFractionDigits: d });
const fmt = v => (v < 0 && Math.round(Math.abs(v) * 100) > 0 ? "−" : "") + num(v);       // "−2,39" / "1,69"
const fmtSigned = v => (v < 0 ? "−" : "+") + num(v);
const normText = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

// ---------- Daten ----------
const ASSETS = [];
const BY_ID = new Map();
let dataLoaded = false, loadError = null;
let ROSTER_SPOT_VALUE = 0, TAXI_WEIGHT = 0;
let teamA = [], teamB = [];

async function loadData() {
  try {
    const get = u => fetch(u, { cache: "no-cache" });
    const [pr, kr, cr] = await Promise.all([get("output/calculator_players.json"), get("output/calculator_picks.json"), get("output/calculator_config.json")]);
    if (!pr.ok || !kr.ok) throw new Error("HTTP " + pr.status + "/" + kr.status);
    const players = await pr.json(), picks = await kr.json();
    if (cr.ok) {
      const c = await cr.json();
      ROSTER_SPOT_VALUE = c.roster_spot_value || 0;
      TAXI_WEIGHT = c.taxi_weight || 0;
    }
    ASSETS.push(
      ...players.map(p => ({ id: p.id, type: "player", name: p.name, pos: p.pos, team: p.team, age: p.age, value: p.value, src: p.src, selectable: p.selectable, isTaxi: p.is_taxi })),
      ...picks.map(p => ({ id: p.id, type: "pick", name: "Pick " + p.label, pos: "PICK", team: "", age: null, value: p.value, selectable: true })),
    );
    ASSETS.forEach(a => { a.n = normText(a.name); a.hay = normText(`${a.name} ${a.pos} ${a.team}`); BY_ID.set(a.id, a); });
    dataLoaded = true;
  } catch (err) {
    loadError = err.message || String(err);
  }
  prepFinder();
  route();
}

// ---------- Anzeige einzelner Assets ----------
function infoLine(a) {
  if (a.type === "pick") return esc(t("rookie_pick"));
  const bits = [];
  if (a.team) bits.push(esc(a.team));
  if (a.age != null && !Number.isNaN(a.age)) bits.push(esc(t("yrs", num(a.age, 1))));
  let s = bits.join(" · ");
  if (a.isTaxi) s += `<span class="tag">${t("taxi")}</span>`;
  if (a.src === "rank_imputed") s += `<span class="tag">${t("from_rank")}</span>`;
  else if (a.src === "trailing") s += `<span class="tag warn">${t("past")}</span>`;
  else if (a.src === "none") s += `<span class="tag warn">${t("no_data")}</span>`;
  return s;
}
const nameHtml = a => `${esc(a.name)}${a.type === "player" ? `<span class="pos">${esc(a.pos)}</span>` : ""}`;
const isNA = a => a.type === "player" && (a.selectable === false || a.value == null);

// ---------- Rechner ----------
function bodyCount(list) {
  // Picks brauchen keinen Rosterplatz; Taxi-faehige (1./2. Jahr) zaehlen nur mit TAXI_WEIGHT.
  return list.reduce((s, a) => a.type !== "player" ? s : s + (a.isTaxi ? TAXI_WEIGHT : 1), 0);
}

function renderCalc(main) {
  const side = (k, label) => `<section class="side ${k.toLowerCase()}">
      <div class="side-head"><h4>${label}</h4><span class="count" id="count${k}"></span></div>
      <input class="search" id="search${k}" type="text" autocomplete="off" spellcheck="false" ${dataLoaded ? "" : "disabled"}
        placeholder="${esc(dataLoaded ? t("search_ph", label) : t("loading"))}" aria-label="${esc(t("search_ph", label))}">
      <ul class="results" id="results${k}"></ul>
      <ul class="assets" id="list${k}"></ul>
      <div class="total"><span class="lab">${t("total")}</span><span class="num" id="total${k}">0,00</span></div>
      <div class="adj" id="adj${k}"></div>
    </section>`;
  main.innerHTML = `${loadError ? `<div class="notice err">${esc(t("load_err", loadError))}</div>` : ""}
    <section class="card"><div class="card-head"><h3>${t("compare")}</h3></div>
      <div class="card-body">
        <div class="verdict-val" id="verdictVal"><b id="delta">—</b><span class="meta" id="deltaSub"></span></div>
        <div class="track"><div class="tick"></div><div class="fill" id="fill"></div></div>
        <div class="track-labels"><span class="la">${t("team_a")}</span><span class="lb">${t("team_b")}</span></div>
      </div></section>
    <div class="sides">${side("A", t("team_a"))}${side("B", t("team_b"))}</div>
    <p class="srcline">${esc(t("sources"))}</p>`;
  setupSearch("A"); setupSearch("B");
  updateDesk();
}

function setupSearch(k) {
  const input = document.getElementById("search" + k), box = document.getElementById("results" + k);
  if (!input) return;
  let hits = [];
  const list = () => (k === "A" ? teamA : teamB);

  function show() {
    const q = normText(input.value);
    if (!q) { box.innerHTML = ""; hits = []; return; }
    const tokens = q.split(" ");
    const taken = new Set([...teamA, ...teamB].map(a => a.id));       // nichts doppelt auswaehlbar
    hits = ASSETS.filter(a => !taken.has(a.id) && tokens.every(tok => a.hay.includes(tok)))
      .sort((x, y) => (y.n.startsWith(q) - x.n.startsWith(q)) || ((isNA(x) ? 1 : 0) - (isNA(y) ? 1 : 0)) || ((y.value ?? -1e9) - (x.value ?? -1e9)))
      .slice(0, 8);
    if (!hits.length) { box.innerHTML = `<li class="res-empty">${t("no_match")}</li>`; return; }
    box.innerHTML = hits.map(a => {
      const na = isNA(a);
      return `<li class="res${na ? " off" : ""}" data-id="${esc(a.id)}">
        <div><div class="a-name">${nameHtml(a)}</div><div class="a-info">${infoLine(a)}</div></div>
        <div class="a-val${na ? " na" : a.value < 0 ? " neg" : ""}">${na ? t("na") : fmt(a.value)}</div></li>`;
    }).join("");
  }
  function add(a) {
    if (!a || isNA(a)) return;
    list().push(a);
    input.value = ""; box.innerHTML = ""; hits = [];
    updateDesk();
    input.focus();
  }
  input.addEventListener("input", show);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") add(hits.find(a => !isNA(a)));
    if (e.key === "Escape") { input.value = ""; box.innerHTML = ""; hits = []; }
  });
  box.addEventListener("click", e => {
    const li = e.target.closest(".res[data-id]");
    if (li && !li.classList.contains("off")) add(BY_ID.get(li.dataset.id));
  });
}

function renderList(k) {
  const list = k === "A" ? teamA : teamB;
  const el = document.getElementById("list" + k);
  el.innerHTML = list.length ? list.map((a, i) => `<li class="asset">
      <div class="a-main"><div class="a-name">${nameHtml(a)}</div><div class="a-info">${infoLine(a)}</div></div>
      <div class="a-val${a.value < 0 ? " neg" : ""}">${fmt(a.value)}</div>
      <button class="x" data-side="${k}" data-i="${i}" aria-label="${esc(t("remove"))}" title="${esc(t("remove"))}">×</button></li>`).join("")
    : `<li class="empty-side">${t("empty_side")}</li>`;
  el.querySelectorAll(".x").forEach(b => b.addEventListener("click", () => {
    (k === "A" ? teamA : teamB).splice(+b.dataset.i, 1);
    updateDesk();
  }));
  document.getElementById("count" + k).textContent = t("assets", list.length);
  return list.reduce((s, a) => s + a.value, 0);
}

function updateDesk() {
  if (!document.getElementById("listA")) return;
  const rawA = renderList("A"), rawB = renderList("B");

  // Rosterplatz-Abzug: nur die Seite, die NETTO mehr Koerper aufnimmt (kein Bonus fuer die andere).
  const bA = bodyCount(teamA), bB = bodyCount(teamB);
  const netA = bA - bB, netB = bB - bA;
  const adjA = netA > 0 ? -netA * ROSTER_SPOT_VALUE : 0;
  const adjB = netB > 0 ? -netB * ROSTER_SPOT_VALUE : 0;
  const totalA = rawA + adjA, totalB = rawB + adjB;

  document.getElementById("adjA").textContent = adjA ? t("roster_adj", fmt(adjA), num(netA)) : "";
  document.getElementById("adjB").textContent = adjB ? t("roster_adj", fmt(adjB), num(netB)) : "";
  const tA = document.getElementById("totalA"), tB = document.getElementById("totalB");
  tA.textContent = fmt(totalA); tB.textContent = fmt(totalB);
  renderMeter(totalA, totalB);
}

function renderMeter(totalA, totalB) {
  const fill = document.getElementById("fill"), delta = document.getElementById("delta"), sub = document.getElementById("deltaSub");
  const box = document.getElementById("verdictVal");
  const empty = !teamA.length && !teamB.length;
  const d = totalA - totalB;
  const leader = empty || Math.abs(d) < 0.005 ? null : d > 0 ? "A" : "B";
  const scale = Math.max(Math.abs(totalA), Math.abs(totalB), 1) * 1.5;      // Null-Mitte: unabhaengig vom Vorzeichen der Summen
  const offset = empty ? 0 : Math.max(-50, Math.min(50, (d / scale) * 50));
  const pos = 50 - offset;
  fill.style.left = Math.min(50, pos) + "%";
  fill.style.width = Math.abs(pos - 50) + "%";
  fill.style.backgroundColor = leader === "A" ? "var(--a)" : leader === "B" ? "var(--b)" : "var(--fair)";
  box.className = "verdict-val" + (leader ? " " + leader : "");
  if (empty) { delta.textContent = "—"; sub.textContent = t("both_empty"); return; }
  if (!leader) { delta.textContent = num(0); sub.textContent = t("even"); return; }
  const name = t(leader === "A" ? "team_a" : "team_b");
  delta.textContent = `${name} ${fmtSigned(Math.abs(d))}`;
  sub.textContent = t("gets_more", name);
}

// ---------- Trade-Finder ----------
// Kader kommen frisch aus dem Free-Agent-Radar (alle 4 h), Depth Charts aus free_agents.json (optional).
const LEAGUE_URL = "https://raw.githubusercontent.com/Commissioner-D/mld-free-agents/data/data/league.json";
const FA_URL = "https://raw.githubusercontent.com/Commissioner-D/mld-free-agents/data/data/free_agents.json";
const SLOTS = { QB: 1, RB: 2, WR: 2, TE: 1, K: 1, DL: 2, LB: 2, DB: 2 };          // 15 Starter inkl. 2 Flex
const FLEX = [["RB", "WR", "TE"], ["DL", "LB", "DB"]];                         // RB/WR/TE-Flex, IDP-Wildcard
const GROUP_ORDER = ["QB", "RB", "WR", "TE", "K", "DL", "LB", "DB"];
const GROUP_NAME = { DL: "EDR/IL", DB: "S/CB" };
const groupOf = pos => {
  const p = String(pos || "").split("/")[0].toUpperCase();
  return ({ S: "DB", CB: "DB", DB: "DB", FS: "DB", SS: "DB", EDR: "DL", IL: "DL", DE: "DL", DT: "DL", DL: "DL" })[p] || p;
};
const keyName = s => normText(s).replace(/\b(jr|sr|ii|iii|iv|v)\b/g, " ").replace(/\s+/g, " ").trim();
const CUFF_GROUPS = new Set(["QB", "RB", "TE", "DL", "LB", "S", "CB"]);       // WR3 ist kein Backup von WR1

const FD = { state: "idle", league: null, depth: null, err: null, teams: [], owner: new Map() };
const finder = { team: store.get("mldc_finder_team"), player: null, metric: store.get("mldc_finder_metric") === "dyn" ? "dyn" : "now", contOnly: store.get("mldc_finder_cont") === "1" };

async function loadFinder() {
  if (FD.state !== "idle") return;
  FD.state = "loading";
  const get = u => fetch(u, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  const [lg, fa] = await Promise.allSettled([get(LEAGUE_URL), get(FA_URL)]);
  if (lg.status === "fulfilled") { FD.league = lg.value; FD.state = "ready"; }
  else { FD.err = lg.reason?.message || String(lg.reason); FD.state = "error"; }
  if (fa.status === "fulfilled") FD.depth = fa.value.depth_charts || null;
  prepFinder();
  if (currentView() === "finder") route();
}

function prepFinder() {
  if (!FD.league || !dataLoaded) return;          // braucht beide Quellen; wird nach dem jeweils letzten Laden erneut aufgerufen
  const calc = new Map();
  ASSETS.forEach(a => { if (a.type === "player") calc.set(keyName(a.name) + "|" + groupOf(a.pos), a); });
  FD.owner = new Map();
  FD.teams = FD.league.teams.map(tm => {
    const players = tm.roster.map(r => {
      const g = groupOf(r.pos), c = calc.get(keyName(r.name) + "|" + g);
      const p = {
        id: String(r.fl_id), name: r.name, pos: r.pos, group: g, nfl: r.team, slot: r.slot, injury: r.injury,
        out: r.slot === "IR" || r.slot === "Taxi",
        now: r.pts_avg ?? null,
        dyn: c && c.selectable !== false && c.value != null ? c.value : null,
        teamId: tm.id,
      };
      if (p.now == null && c && typeof c.ppg === "number") { p.now = c.ppg; p.nowProj = true; }
      FD.owner.set(keyName(r.name), { team: tm, player: p });
      return p;
    });
    return { id: tm.id, name: tm.name, owner: tm.owner, mine: tm.mine, record: tm.record, rank: tm.rank, players,
      w: (tm.wins || 0) + 0.5 * (tm.ties || 0) };
  });
  // Contender: Top 7 (Playoff-Plaetze) oder hoechstens 1 Sieg hinter dem 7. Platz
  const seventh = FD.teams.slice().sort((a, b) => (a.rank || 99) - (b.rank || 99))[6];
  FD.contMin = seventh ? seventh.w - 1 : 0;
  FD.teams.forEach(x => { x.contender = (x.rank && x.rank <= 7) || x.w >= FD.contMin; });
  if (!finder.team || !FD.teams.some(x => String(x.id) === String(finder.team)))
    finder.team = String((FD.teams.find(x => x.mine) || FD.teams[0]).id);
}

const mval = p => { const v = finder.metric === "dyn" ? p.dyn : p.now; return v == null ? -Infinity : v; };
const mfmt = v => (v === -Infinity || v == null ? "–" : (v < 0 ? "−" : "") + num(v, finder.metric === "dyn" ? 2 : 1));

function lineup(players) {
  const pool = players.filter(p => !p.out).sort((a, b) => mval(b) - mval(a));
  const start = new Map();                                     // Spieler -> "pos" | "flex"
  for (const g of GROUP_ORDER) pool.filter(p => p.group === g).slice(0, SLOTS[g]).forEach(p => start.set(p, "pos"));
  for (const gs of FLEX) { const p = pool.find(x => !start.has(x) && gs.includes(x.group)); if (p) start.set(p, "flex"); }
  const sum = [...start.keys()].reduce((s, p) => s + (mval(p) === -Infinity ? 0 : mval(p)), 0);
  return { start, sum };
}

function roleOn(team, P) {
  const others = team.players.filter(p => p.id !== P.id);
  const before = lineup(others), after = lineup([...others, P]);
  const grp = [...others.filter(p => p.group === P.group), P].sort((a, b) => mval(b) - mval(a) || (a.out - b.out));
  const active = grp.filter(p => !p.out);
  const rank = active.indexOf(P) + 1;
  const isStart = after.start.has(P);
  let role;
  if (isStart) role = rank === 1 ? "best" : after.start.get(P) === "flex" ? "flex" : "start";
  else role = active.find(p => !after.start.has(p)) === P ? "bench1" : "depth";
  const displaced = isStart ? [...before.start.keys()].find(p => !after.start.has(p)) || null : null;
  const ahead = isStart ? [] : active.filter(p => after.start.has(p));
  const lastStart = ahead.length ? Math.min(...ahead.map(mval)) : null;
  return { role, rank, gain: after.sum - before.sum, displaced, ahead, gap: lastStart != null ? lastStart - mval(P) : null, grp, after };
}

// Handcuff: steht der Spieler im NFL-Depth-Chart hinter einem Starter, der in der MLD jemandem gehört?
function cuffInfo(P) {
  if (!FD.depth || !FD.depth[P.nfl]) return { label: null, starter: null };
  const k = keyName(P.name);
  for (const [grp, list] of Object.entries(FD.depth[P.nfl])) {
    const me = list.find(e => keyName(e.n) === k);
    if (!me) continue;
    const m = /^([A-Z]+?)(\d+)$/.exec(me.l || "");
    if (!m || +m[2] < 2 || !CUFF_GROUPS.has(grp)) return { label: me.l, starter: null };
    const st = list.find(e => e.l === m[1] + "1");
    const own = st && FD.owner.get(keyName(st.n));
    return { label: me.l, starter: own ? { name: st.n, teamId: own.team.id } : null };
  }
  return { label: null, starter: null };
}

function parseFinderHash() {
  const q = new URLSearchParams(location.hash.split("?")[1] || "");
  if (q.get("t")) finder.team = q.get("t");
  if (q.get("p")) finder.player = q.get("p");
}
function setFinderHash() {
  const q = new URLSearchParams();
  if (finder.team) q.set("t", finder.team);
  if (finder.player) q.set("p", finder.player);
  history.replaceState(null, "", "#/finder?" + q.toString());
}

function renderFinder(main) {
  loadFinder();
  if (FD.state === "error") { main.innerHTML = `<div class="notice err">${esc(t("f_err", FD.err))}</div>`; return; }
  if (FD.state !== "ready" || !dataLoaded || !FD.teams.length) {
    main.innerHTML = loadError ? `<div class="notice err">${esc(t("load_err", loadError))}</div>` : `<div class="notice">${t("loading")}</div>`;
    return;
  }
  parseFinderHash();
  const team = FD.teams.find(x => String(x.id) === String(finder.team)) || FD.teams[0];
  finder.team = String(team.id);
  const P = team.players.find(p => p.id === finder.player) || null;
  if (!P) finder.player = null;

  const teamOpts = FD.teams.slice().sort((a, b) => b.mine - a.mine || a.name.localeCompare(b.name))
    .map(x => `<option value="${x.id}" ${x === team ? "selected" : ""}>${esc(x.name)}${x.owner ? " (" + esc(x.owner) + ")" : ""}</option>`).join("");
  const playerOpts = GROUP_ORDER.map(g => {
    const ps = team.players.filter(p => p.group === g).sort((a, b) => mval(b) - mval(a));
    if (!ps.length) return "";
    return `<optgroup label="${esc(GROUP_NAME[g] || g)}">` + ps.map(p =>
      `<option value="${p.id}" ${p === P ? "selected" : ""}>${esc(p.name)} · ${esc(p.pos)}${p.nfl ? " " + esc(p.nfl) : ""} · ${mfmt(mval(p))}${p.out ? " · " + (p.slot === "IR" ? t("ir") : t("taxi_s")) : ""}</option>`).join("") + "</optgroup>";
  }).join("");

  main.innerHTML = `<section class="card"><div class="card-head"><h3>${t("finder")}</h3><span class="meta">${esc(t("f_stand", FD.league.generated_utc || "?"))}</span></div>
    <div class="card-body">
      <div class="f-controls">
        <div><label for="fTeam">${t("f_team")}</label><select id="fTeam">${teamOpts}</select></div>
        <div><label for="fPlayer">${t("f_player")}</label><select id="fPlayer"><option value="">${t("f_pick")}</option>${playerOpts}</select></div>
      </div>
      <div class="f-row2"><span class="meta">${P ? "" : esc(t("f_intro"))}</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><div class="seg" role="group"><button data-c="1" aria-pressed="${finder.contOnly}" title="${esc(t("cont_hint", num(FD.contMin, 0)))}">${t("cont_only")}</button></div><div class="seg" role="group"><button data-m="now" aria-pressed="${finder.metric === "now"}">${t("m_now")}</button><button data-m="dyn" aria-pressed="${finder.metric === "dyn"}">${t("m_dyn")}</button></div></div></div>
      <div id="fSum"></div>
    </div></section><div id="fRes"></div>`;

  document.getElementById("fTeam").onchange = e => { finder.team = e.target.value; finder.player = null; store.set("mldc_finder_team", finder.team); setFinderHash(); route(); };
  document.getElementById("fPlayer").onchange = e => { finder.player = e.target.value || null; setFinderHash(); route(); };
  main.querySelectorAll(".seg button[data-c]").forEach(b => b.onclick = () => { finder.contOnly = !finder.contOnly; store.set("mldc_finder_cont", finder.contOnly ? "1" : null); route(); });
  main.querySelectorAll(".seg button[data-m]").forEach(b => b.onclick = () => { finder.metric = b.dataset.m; store.set("mldc_finder_metric", finder.metric); route(); });
  if (P) renderFinderResults(team, P);
}

function renderFinderResults(team, P) {
  const unit = finder.metric === "dyn" ? t("val_unit") : t("per_week");
  const cuff = cuffInfo(P);
  const own = roleOn(team, P);
  const roleLbl = r => t({ best: "r_best", start: "r_start", flex: "r_flex", bench1: "r_bench1", depth: "r_depth" }[r]);
  const bits = [`<b>${esc(P.name)}</b> <span class="meta">${esc(P.pos)} · ${esc(P.nfl || "–")}</span>`,
    `${t("m_now")}: <b>${P.now != null ? num(P.now, 1) : "–"}</b>`, `${t("m_dyn")}: <b>${P.dyn != null ? fmt(P.dyn) : "–"}</b>`];
  let sub = `${t("here")}: <span class="role ${own.role === "flex" ? "start" : own.role}">${roleLbl(own.role)}</span>`;
  if (cuff.label) sub += ` · ${esc(t("depth_lbl", cuff.label, P.nfl))}`;
  if (cuff.starter && String(cuff.starter.teamId) === String(team.id)) sub += ` <span class="tag cuff">${esc(t("cuff_own", cuff.starter.name))}</span>`;
  document.getElementById("fSum").innerHTML = `<div class="f-sum"><div>${bits.join(" · ")}</div><div class="a-info" style="margin-top:4px">${sub}</div>
    ${mval(P) === -Infinity ? `<div class="notice" style="margin:8px 0 0">${esc(t("no_metric"))}</div>` : ""}</div>`;

  const others = FD.teams.filter(x => x !== team);
  const hidden = finder.contOnly ? others.filter(x => !x.contender).length : 0;
  const rows = others.filter(x => !finder.contOnly || x.contender).map(tm => {
    const r = roleOn(tm, P);
    r.team = tm;
    r.cuff = cuff.starter && String(cuff.starter.teamId) === String(tm.id) ? cuff.starter.name : null;
    return r;
  });
  const S = { start: [], bench1: [], cuff: [], depth: [] };
  rows.forEach(r => {
    if (["best", "start", "flex"].includes(r.role)) S.start.push(r);
    else if (r.role === "bench1") S.bench1.push(r);
    else if (r.cuff) S.cuff.push(r);
    else S.depth.push(r);
  });
  S.start.sort((a, b) => b.gain - a.gain);
  S.bench1.sort((a, b) => (a.gap ?? 1e9) - (b.gap ?? 1e9));
  S.depth.sort((a, b) => a.rank - b.rank || (a.gap ?? 1e9) - (b.gap ?? 1e9));

  const rowHtml = r => {
    let line;
    if (r.displaced) line = t("replaces", esc(r.displaced.name), mfmt(mval(r.displaced)));
    else if (["best", "start", "flex"].includes(r.role)) line = t("fills");
    else line = t("behind", r.ahead.slice(0, 3).map(p => `${esc(p.name)} (${mfmt(mval(p))})`).join(", ")) + (r.gap != null && r.gap !== Infinity ? ` · ${t("gap", mfmt(r.gap))}` : "");
    const gainHtml = ["best", "start", "flex"].includes(r.role)
      ? `<div class="ft-gain ${r.gain > 0.005 ? "pos" : "neg"}">${r.gain > 0.005 ? "+" : ""}${mfmt(r.gain)} ${esc(unit)}</div>` : "";
    const depthList = r.grp.map((p, i) => {
      const cls = [p === P ? "me" : "", r.after.start.has(p) ? "st" : "", p.out ? "out" : ""].join(" ");
      const tags = (p.out ? `<span class="tag">${p.slot === "IR" ? t("ir") : t("taxi_s")}</span>` : "") + (p.injury ? `<span class="tag warn">${esc(p.injury)}</span>` : "")
        + (r.after.start.get(p) === "flex" ? `<span class="tag">Flex</span>` : "");
      return `<li class="${cls}"><span class="rk">${i + 1}</span><span class="nm">${esc(p.name)} <span class="meta">${esc(p.pos)} ${esc(p.nfl || "")}</span>${tags}</span><span class="v">${mfmt(mval(p))}</span></li>`;
    }).join("");
    return `<details class="ft"><summary>
        <div class="a-main"><div class="ft-team">${esc(r.team.name)}<span class="ft-rec">${esc(r.team.record || "")}${r.team.rank ? " · #" + r.team.rank : ""}</span></div>
          <div class="a-info">${line}${r.cuff ? ` <span class="tag cuff">${esc(t("cuff", r.cuff))}</span>` : ""}</div></div>
        <div class="ft-side"><span class="role ${r.role === "flex" ? "start" : r.role}">${roleLbl(r.role)}</span>${gainHtml}</div>
      </summary><ol class="depth">${depthList}</ol></details>`;
  };
  const sec = (key, title, list, collapsed) => {
    if (!list.length && key !== "start") return "";
    const body = list.length ? list.map(rowHtml).join("") : `<div class="empty-side">${t("none_here")}</div>`;
    return collapsed
      ? `<details class="f-more"><summary><span class="f-sec" style="margin:0;display:inline-flex">${title} <span class="n">${list.length}</span></span></summary>${body}</details>`
      : `<div class="f-sec">${title} <span class="n">${list.length}</span></div>${body}`;
  };
  document.getElementById("fRes").innerHTML =
    sec("start", t("sec_start"), S.start) + sec("bench1", t("sec_bench1"), S.bench1) + sec("cuff", t("sec_cuff"), S.cuff) + sec("depth", t("sec_depth"), S.depth, true)
    + (hidden ? `<p class="meta" style="margin-top:14px">${esc(t("cont_hidden", hidden))} · ${esc(t("cont_hint", num(FD.contMin, 0)))}</p>` : "");
}

// ---------- Info ----------
function renderInfo(main) {
  const rsv = ROSTER_SPOT_VALUE ? num(ROSTER_SPOT_VALUE) : "–";
  const tw = TAXI_WEIGHT ? num(TAXI_WEIGHT) : "5/28";
  const de = `<h2>So wird gerechnet</h2>
    <h3>Was der Wert bedeutet</h3>
    <p>Jeder Spieler bekommt einen Dynasty-Wert über Ersatzniveau. Grundlage ist <b>SCR</b>: die projizierten Punkte der Saison (Yards, TDs, Tackles, Sacks … von FantasyPros), umgerechnet mit dem Scoring dieser Liga, abzüglich des Ersatzniveaus der Position. Dazu kommen ein Alters- und ein Draft-Kapital-Anteil. Peak-Alter je Position stammen aus Alterskurven-Recherche, Steigung und Draft-Gewicht sind gegen das FantasyPros-Dynasty-Expertenranking gefittet.</p>
    <p class="formula">Wert = SCR × Altersfaktor + Draft-Bonus<br>(bei negativem SCR: SCR ÷ Altersfaktor)</p>
    <h3>Ersatzniveau</h3>
    <p>Rang des Ersatzspielers = Mittel aus (a) der tatsächlich gerosterten Zahl der Position in der Liga (bei jedem Update neu gezählt) und (b) den Start-Slots inklusive Flex-Anteil.</p>
    <h3>Spieler ohne Projektion</h3>
    <ul><li>Hat der Spieler einen Dynasty-Rang, aber keine Projektion, wird SCR aus dem Rang abgeleitet (Kurve aus Spielern, die beides haben). Markiert als „aus Dynasty-Rang“.</li>
    <li>Hat er weder Projektion noch Rang, steht <b>NA</b> in Rot, und er ist nicht auswählbar. Es wird nicht geraten, und vergangene Produktion wird nicht als Ersatz verwendet.</li>
    <li>Einzige Ausnahme: Kicker (keine Projektion, kein Ranking verfügbar) laufen auf dem Schnitt der letzten Saisons (65 % aktuell, 35 % Vorjahr).</li></ul>
    <h3>IDP</h3>
    <p>IDP ist ein gröberer Fit als Offense: Alter und Draft-Kapital hängen bei Defensivspielern deutlich schwächer mit dem Dynasty-Rang zusammen, es gibt mehr Ausreißer. Für CB und IL gibt es zu wenige Vergleichsspieler für einen eigenen Fit, sie übernehmen Steigung und Draft-Gewicht von Safety bzw. EDR. Die Position kommt von Fleaflicker; Spieler, die dort weder gelistet noch gerostert sind, fallen auf die nflverse-Position zurück.</p>
    <h3>Picks</h3>
    <p>Handelbar sind nur die nächsten zwei Jahrgänge (Regelwerk). Die Kurve ist aus den sechs Rookie-Drafts der Liga (2020–2025, 480 Spieler) gegen die heutigen Spielerwerte gefittet. <b>Sie wird gerade überarbeitet:</b> späte Picks können aktuell unter 0 fallen, und beide Jahrgänge sind gleich bewertet.</p>
    <h3>Rosterplatz-Abzug</h3>
    <p>Ein Trade mit ungleicher Spielerzahl ist nicht gratis: Die Seite, die netto mehr Spieler aufnimmt, muss später jemanden schneiden und bekommt einen Abzug. Er ist so groß wie der Schnitt der 15 besten nicht gerosterten Spieler (aktuell <b>${rsv}</b>, bei jedem Update neu berechnet). Picks zählen nicht. Taxi-fähige Spieler (1./2. Jahr) zählen nur mit ${tw} (5/28), weil Taxi-Plätze zusätzlich zu den 28 aktiven Plätzen existieren.</p>
    <h3>Trade-Finder</h3>
    <p>Der gewählte Spieler wird probeweise in jeden anderen Kader gesetzt. Dann wird die beste Aufstellung gebaut (QB, 2 RB, 2 WR, TE, RB/WR/TE-Flex, K, 2 EDR/IL, 2 LB, 2 S/CB, IDP-Wildcard). Spieler auf IR oder Taxi zählen nicht, ein verletzter Starter auf IR macht also Platz.</p>
    <ul><li><b>Bester Spieler</b>: Nr. 1 seiner Gruppe in diesem Kader. <b>Starter</b>: in der Aufstellung, ggf. über den Flex. Die grüne Zahl ist der Zugewinn der Aufstellung pro Woche (bzw. an Dynasty-Wert).</li>
    <li><b>1. Ersatz</b>: erster Mann von der Bank in seiner Gruppe. <b>Tiefe</b>: dahinter.</li>
    <li><b>Nur Contender</b>: blendet Teams aus, die weder auf Playoff-Platz (Top 7) noch höchstens einen Sieg dahinter liegen.</li>
    <li><b>Handcuff</b>: Steht der Spieler im NFL-Depth-Chart hinter einem Starter (z. B. RB2 hinter RB1), wird das Team markiert, dem dieser Starter gehört. Nicht bei WR.</li>
    <li>Maßstab „Jetzt“ = Fleaflicker-Punkte pro Spiel dieser Saison (ohne Spiele: gewichteter Schnitt aus dem Rechner). „Dynasty-Wert“ = Wert aus dem Rechner.</li></ul>
    <p>Kader und Punkte kommen aus dem Free-Agent-Radar (alle 4 Stunden aktualisiert).</p>
    <h3>Quellen</h3>
    <p>FantasyPros (Projektionen, Dynasty-Expertenranking), Fleaflicker (Rosters, Positionen, Regelwerk), nflverse (Alter, Draft-Position, Statistiken).</p>`;
  const en = `<h2>How it's calculated</h2>
    <h3>What the value means</h3>
    <p>Every player gets a dynasty value above replacement level. The base is <b>SCR</b>: the season's projected points (yards, TDs, tackles, sacks … from FantasyPros) run through this league's own scoring, minus the position's replacement level. An age part and a draft-capital part are added on top. Peak ages per position come from aging-curve research; slope and draft weight are fitted against the FantasyPros dynasty expert consensus.</p>
    <p class="formula">value = SCR × age factor + draft bonus<br>(for negative SCR: SCR ÷ age factor)</p>
    <h3>Replacement level</h3>
    <p>The replacement player's rank = the mean of (a) the number of players actually rostered at that position in the league (recounted on every update) and (b) the starting slots including the flex share.</p>
    <h3>Players without a projection</h3>
    <ul><li>If a player has a dynasty rank but no projection, SCR is inferred from the rank (curve built from players who have both). Marked "from dynasty rank".</li>
    <li>If he has neither projection nor rank, he shows <b>NA</b> in red and can't be added. No guessing, and past production is not used as a substitute.</li>
    <li>Only exception: kickers (no projection or ranking available) run on the average of recent seasons (65% current, 35% prior year).</li></ul>
    <h3>IDP</h3>
    <p>IDP is a rougher fit than offense: age and draft capital correlate much more weakly with dynasty rank for defenders, so expect more edge cases. CB and IL have too few comparison players for their own fit and borrow slope and draft weight from safety and EDR. Positions come from Fleaflicker; players who are neither listed nor rostered there fall back to the nflverse position.</p>
    <h3>Picks</h3>
    <p>Only the next two draft classes are tradable (league rules). The curve is fitted from the league's six rookie drafts (2020–2025, 480 players) against today's player values. <b>It is being reworked:</b> late picks can currently fall below 0, and both classes are valued the same.</p>
    <h3>Roster spot adjustment</h3>
    <p>A trade with an unequal player count isn't free: the side taking on more players net has to cut someone later and gets a deduction. It equals the average of the 15 best unrostered players (currently <b>${rsv}</b>, recalculated on every update). Picks don't count. Taxi-eligible players (1st/2nd year) count only ${tw} (5/28), since taxi slots exist on top of the 28 active spots.</p>
    <h3>Trade Finder</h3>
    <p>The selected player is dropped into every other roster, then the best lineup is built (QB, 2 RB, 2 WR, TE, RB/WR/TE flex, K, 2 EDR/IL, 2 LB, 2 S/CB, IDP wildcard). Players on IR or taxi don't count, so an injured starter on IR opens a spot.</p>
    <ul><li><b>Best player</b>: no. 1 of his group on that roster. <b>Starter</b>: in the lineup, possibly via flex. The green number is the lineup gain per week (or in dynasty value).</li>
    <li><b>1st backup</b>: first man off the bench in his group. <b>Depth</b>: behind that.</li>
    <li><b>Contenders only</b>: hides teams that are neither in a playoff spot (top 7) nor at most one win behind it.</li>
    <li><b>Handcuff</b>: if the player sits behind a starter on the NFL depth chart (e.g. RB2 behind RB1), the team owning that starter is flagged. Not for WR.</li>
    <li>"Now" = Fleaflicker points per game this season (no games: weighted average from the calculator). "Dynasty value" = calculator value.</li></ul>
    <p>Rosters and points come from the free-agent radar (updated every 4 hours).</p>
    <h3>Sources</h3>
    <p>FantasyPros (projections, dynasty expert consensus), Fleaflicker (rosters, positions, rules), nflverse (age, draft position, stats).</p>`;
  main.innerHTML = `<section class="card info"><div class="card-body">${LANG === "de" ? de : en}</div></section>`;
}

// ---------- Router ----------
const currentView = () => location.hash.startsWith("#/info") ? "info" : location.hash.startsWith("#/finder") ? "finder" : "calc";
function route() {
  const view = currentView();
  const tab = (v, k) => `<a href="#/${v}" class="${view === v ? "active" : ""}">${t(k)}</a>`;
  document.getElementById("tabs").innerHTML = tab("calc", "calc") + tab("finder", "finder") + tab("info", "info");
  const main = document.getElementById("main");
  if (view === "info") renderInfo(main); else if (view === "finder") renderFinder(main); else renderCalc(main);
  document.title = "MLD-Rechner" + (view !== "calc" ? " · " + t(view) : "");
}
window.addEventListener("hashchange", route);
renderToggles(document.getElementById("toggles"), route);
route();
loadData();
</script>
</body>
</html>
